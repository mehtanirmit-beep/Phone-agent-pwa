<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#10182a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Phone Agent</title>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#edf4ff;background:#0c1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:24px 18px 100px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:29px;margin:0}p{color:#b9c6db;line-height:1.5}.sub{font-size:13px;color:#8fa2c2}.card{background:#17233a;border:1px solid #2d3d5a;border-radius:20px;padding:18px;margin-top:18px}textarea,input,select{width:100%;border:1px solid #415575;background:#0e1728;color:#fff;border-radius:12px;padding:13px;font-size:16px}textarea{min-height:112px;resize:vertical}button{border:0;border-radius:12px;padding:13px 16px;background:#537ef8;color:white;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#2b3b58}button.danger{background:#74344b}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}button:disabled{opacity:.45}.chip{display:inline-block;background:#263d62;border-radius:999px;padding:7px 11px;font-size:12px;color:#cddcf4}#log{white-space:pre-wrap;line-height:1.5;min-height:65px}label{display:block;margin:12px 0 6px;color:#c8d6eb;font-size:14px}details{margin-top:20px}summary{cursor:pointer;font-weight:700}.status{color:#8fe0b2}.muted{color:#98a9c5;font-size:13px}.pillrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.pillrow button{font-size:12px;background:#2b3b58;padding:9px 12px}
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>✦ Phone Agent</h1>
          <div class="sub">Private assistant · iPhone edition</div>
        </div>
        <span class="chip">Free starter</span>
      </header>
      <p>Speak or type a command. Review each phone action before opening it.</p>

      <section class="card">
        <label for="command">Your command</label>
        <textarea id="command" placeholder="Try: Open Maps for coffee shops in Jaipur"></textarea>
        <div class="row">
          <button id="mic">🎙 Tap to speak</button>
          <button id="run">Run command</button>
        </div>
        <div class="pillrow">
          <button data-cmd="Open Maps for coffee shops">Maps</button>
          <button data-cmd="Search the web for textile printing">Web search</button>
          <button data-cmd="Run shortcut Morning Routine">Shortcut</button>
          <button data-cmd="Make a note: Check fabric inventory">Save note</button>
        </div>
      </section>

      <section class="card">
        <strong>Agent response</strong>
        <div id="log" style="margin-top:12px">Ready. No command has been run.</div>
        <div id="actions" class="row"></div>
      </section>

      <details class="card">
        <summary>Settings & AI connection</summary>
        <p class="muted">Offline command mode works without an account. For open-ended AI, connect a trusted HTTPS server endpoint that you control. Never paste a provider API key into this page.</p>
        <label for="endpoint">Optional AI endpoint (HTTPS)</label>
        <input id="endpoint" type="url" placeholder="https://your-server.example/api/chat">
        <div class="row">
          <button id="save" class="secondary">Save endpoint</button>
          <button id="clear" class="danger">Clear saved data</button>
        </div>
        <p class="muted">Expected API: POST JSON {"message":"..."}; response JSON {"reply":"..."}. Endpoint responses are displayed as text, not automatically executed.</p>
      </details>

      <details class="card">
        <summary>Saved notes</summary>
        <div id="notes"></div>
      </details>

      <p class="muted">Voice recognition requires browser support, microphone permission and an internet connection in some cases. For commands not recognized, type instead. This app cannot read other apps, access native contacts/calendar directly, or silently send messages.</p>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
